name: Deployed assets

# Reusable gate: waits for the Vercel preview of a pull request, then fails if
# any reference on it does not resolve.
#
# Callers need no secrets and no Vercel API token. Vercel publishes each preview
# as a GitHub Deployment whose ref is the head SHA, so the built-in token is
# enough to find the URL.

on:
  workflow_call:
    inputs:
      base_url:
        description: 'Check this URL instead of waiting for a preview.'
        type: string
        required: false
        default: ''
      sha:
        description: 'Commit to find a preview for. Defaults to the PR head.'
        type: string
        required: false
        default: ''
      max_pages:
        description: 'Upper bound on pages crawled.'
        type: number
        required: false
        default: 50
      request_concurrency:
        description: 'Parallel requests while checking references.'
        type: number
        required: false
        default: 8

jobs:
  # These must be granted by the calling job too. A called workflow may only
  # narrow the caller's permissions, never widen them, and the default token is
  # `read` — which covers contents and metadata but *not* deployments. A caller
  # that omits them fails at startup with no job and no log to explain why.
  deployed-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read

    steps:
      # Pinned to the tag this workflow is published under, so `@v1` cannot pair
      # a v1 workflow with a main-branch script. Bump both together when cutting
      # a new major.
      - uses: actions/checkout@v7
        with:
          repository: monk-code/deployed-asset-check
          ref: v1
          path: .deployed-asset-check

      # Node 24 runs the .ts scripts directly via type stripping. The runner's
      # preinstalled Node is older, so this is not optional.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Wait for the Vercel preview
        id: preview
        if: inputs.base_url == ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha != '' && inputs.sha || github.event.pull_request.head.sha }}
        run: node .deployed-asset-check/scripts/wait-for-vercel-preview.ts

      # No URL means the wait step found the repository has never deployed at
      # all, so there is nothing to check yet.
      - name: Check every reference resolves
        if: inputs.base_url != '' || steps.preview.outputs.url != ''
        env:
          TARGET: ${{ inputs.base_url != '' && inputs.base_url || steps.preview.outputs.url }}
          MAX_PAGES: ${{ inputs.max_pages }}
          REQUEST_CONCURRENCY: ${{ inputs.request_concurrency }}
        run: |
          node .deployed-asset-check/scripts/check-deployed-assets.ts \
            "$TARGET" --max-pages "$MAX_PAGES" --concurrency "$REQUEST_CONCURRENCY"
