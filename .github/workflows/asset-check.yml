name: Deployed assets

# Reusable gate: waits for the Vercel preview of a pull request, then fails if
# any reference on it does not resolve.
#
# Callers need no secrets and no Vercel API token. Vercel publishes each preview
# as a GitHub Deployment whose ref is the head SHA, so the built-in token is
# enough to find the URL.

on:
  workflow_call:
    inputs:
      sha:
        description: 'Commit to find a preview for. Defaults to the PR head.'
        type: string
        required: false
      max-pages:
        description: 'Upper bound on pages crawled.'
        type: number
        required: false
        default: 50
      concurrency:
        description: 'Parallel requests while checking references.'
        type: number
        required: false
        default: 8

jobs:
  deployed-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read

    steps:
      # Pin the scripts to the same ref the caller pinned this workflow to, so
      # `@v1` cannot silently pair a v1 workflow with a main-branch script.
      # job_workflow_ref is the reusable workflow's own path; the caller's is
      # github.workflow_ref, which would resolve to the wrong repository.
      - name: Resolve this workflow's ref
        id: source
        env:
          JOB_WORKFLOW_REF: ${{ github.job_workflow_ref }}
        run: |
          ref="${JOB_WORKFLOW_REF##*@}"
          if [ -z "$ref" ] || [ "$ref" = "$JOB_WORKFLOW_REF" ]; then
            echo "::error::Could not read a ref from job_workflow_ref ('$JOB_WORKFLOW_REF')"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Checker source: $ref"

      - uses: actions/checkout@v7
        with:
          repository: monk-code/deployed-asset-check
          ref: ${{ steps.source.outputs.ref }}
          path: .deployed-asset-check

      # Node 24 runs the .ts scripts directly via type stripping. The runner's
      # preinstalled Node is older, so this is not optional.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Wait for the Vercel preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
        run: node .deployed-asset-check/scripts/wait-for-vercel-preview.ts

      - name: Check every reference resolves
        run: |
          node .deployed-asset-check/scripts/check-deployed-assets.ts \
            "${{ steps.preview.outputs.url }}" \
            --max-pages "${{ inputs.max-pages }}" \
            --concurrency "${{ inputs.concurrency }}"
